<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#777;display:flex;flex-wrap:wrap;gap:24px;padding:24px;font-family:system-ui}
  /* Each master is a flat 1024x1024, NO corner rounding, NO alpha/transparency. */
  .master{width:1024px;height:1024px;position:relative;overflow:hidden}
  .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        width:594px;height:594px;border-radius:50%;box-sizing:border-box;
        display:flex;align-items:center;justify-content:center}
  .disc{width:72%;height:72%;border-radius:50%}
  /* Default (light) */
  #icon-default{background:linear-gradient(180deg,#fdfdff,#eceef3)}
  #icon-default .ring{border:37px solid #2a2a30}
  #icon-default .disc{background:#ff7a00;box-shadow:0 0 110px rgba(255,122,0,.5)}
  /* Dark */
  #icon-dark{background:linear-gradient(160deg,#2f2f36,#0f0f11)}
  #icon-dark .ring{border:37px solid rgba(255,255,255,.9)}
  #icon-dark .disc{background:#ff7a00;box-shadow:0 0 110px rgba(255,122,0,.5)}
  /* Tinted (grayscale luminance master, opaque black backdrop per HIG) */
  #icon-tinted{background:#000}
  #icon-tinted .ring{border:37px solid rgba(235,235,245,.55)}
  #icon-tinted .disc{background:#8e8e93}
  .cap{position:absolute;left:0;bottom:0;padding:8px 14px;background:rgba(0,0,0,.6);color:#fff;font:600 22px/1 system-ui}
</style>
</head>
<body>
  <div class="master" id="icon-default"><div class="ring"><div class="disc"></div></div></div>
  <div class="master" id="icon-dark"><div class="ring"><div class="disc"></div></div></div>
  <div class="master" id="icon-tinted"><div class="ring"><div class="disc"></div></div></div>
</body>
</html>
